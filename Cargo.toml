[package]
name = "botcoder"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.42", features = ["full"] }
tokio-stream = "0.1"
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1.89"
dotenvy = "0.15.7"
color-eyre = "0.6.5"
crossterm = "0.29.0"
ratatui = "0.29.0"
futures = "0.3"
regex = "1.10"
